<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threat-Detect Unidirectional Dashboard</title>
    <link rel="stylesheet" href="style.css?v=nocache3">
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="dashboard-container">
        <header>
            <div class="logo">
                <span class="icon">🛡️</span> ThreatDetect <span class="highlight">Unidirectional</span>
            </div>
            <div class="controls">
                <select id="select-scenario" class="scenario-select" title="Choose Attack Profile">
                    <option value="random">🎲 Random Dynamic Threat Mix</option>
                    <option value="massive_ddos">💥 Massive DDoS (Thousands of alerts, 0 C2)</option>
                    <option value="stealth_c2_exfil">🕵️ Stealthy C2 & DNS Exfil (0 DDoS)</option>
                    <option value="recon_storm">🔍 Reconnaissance Scans (0 DDoS, 0 C2)</option>
                    <option value="quiet_hours">🕊️ Calm Baseline (Near 0 threats)</option>
                    <option value="coordinated_campaign">⚡ Coordinated Multi-Vector Attack</option>
                </select>
                <span id="status-indicator" class="status idle">Idle</span>
                <button id="btn-replay" class="btn primary">Start Live Demo Replay</button>
            </div>
        </header>

        <main>
            <div class="top-panels">
                <div class="panel glass">
                    <h2>Alerts by Threat Class</h2>
                    <div class="chart-container">
                        <canvas id="classChart"></canvas>
                    </div>
                </div>
                <div class="panel glass">
                    <h2>Top Talkers (Source IPs)</h2>
                    <ul id="top-talkers-list" class="talkers-list">
                        <!-- Populated by JS -->
                    </ul>
                </div>
            </div>

            <div class="main-panel glass">
                <div class="panel-header">
                    <h2>Recent Alerts</h2>
                    <div class="filters">
                        <select id="filter-severity">
                            <option value="">All Severities</option>
                            <option value="CRITICAL">Critical</option>
                            <option value="HIGH">High</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="LOW">Low</option>
                        </select>
                    </div>
                </div>
                <div class="table-container">
                    <table id="alerts-table">
                        <thead>
                            <tr>
                                <th>Timestamp</th>
                                <th>Threat Class</th>
                                <th>Severity</th>
                                <th>Confidence</th>
                                <th>Source</th>
                                <th>Destination</th>
                            </tr>
                        </thead>
                        <tbody id="alerts-tbody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Drilldown -->
    <div id="drilldown-modal" class="modal hidden">
        <div class="modal-content glass">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title">Alert Details</h2>
            <div class="modal-body">
                <div class="modal-section">
                    <h3>Explanation</h3>
                    <p id="modal-explanation" class="code-block"></p>
                </div>
                <div class="modal-section">
                    <h3>Features</h3>
                    <pre id="modal-features" class="code-block"></pre>
                </div>
                <div class="modal-section">
                    <h3>Correlated Alerts</h3>
                    <ul id="modal-related"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=nocache3"></script>
</body>

</html>
