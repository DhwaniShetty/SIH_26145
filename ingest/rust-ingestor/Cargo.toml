[package]
name = "rust-ingestor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-ingestor"
path = "src/main.rs"

[dependencies]
# PCAP reading
pcap = "1.3"

# Kafka producer
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Packet parsing
pnet = "0.35"
pnet_packet = "0.35"

# Serialization to JSON for Kafka messages
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI args
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
