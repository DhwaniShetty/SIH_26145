version: "3.9"

# =============================================================================
# 50k PPS Threat Detection Pipeline
#
# Services:
#   zookeeper    - Kafka metadata coordination
#   kafka        - Universal data bus (raw-features, alerts-normalized, telemetry)
#   kafka-init   - Creates Kafka topics on first launch
#   clickhouse   - Columnar alert store (replaces SQLite)
#   ingestor     - Rust: PCAP replay → raw-features topic (50k PPS)
#   inference    - Python/ONNX: raw-features → alerts-normalized topic
#   dashboard    - FastAPI: alerts API + SSE live stream
# =============================================================================

networks:
  threat-net:
    driver: bridge

volumes:
  clickhouse-data:
  kafka-data:
  zookeeper-data:
  onnx-models:

# ─────────────────────────────────────────────────────────────────────────────
# Infrastructure Layer
# ─────────────────────────────────────────────────────────────────────────────

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks: [threat-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Throughput tuning
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 16
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 100000
      KAFKA_LOG_RETENTION_HOURS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [threat-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      bash -c "
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092
          --topic raw-features --partitions 8 --replication-factor 1
          --config retention.ms=60000 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092
          --topic alerts-normalized --partitions 4 --replication-factor 1
          --config retention.ms=3600000 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092
          --topic telemetry --partitions 1 --replication-factor 1
          --config retention.ms=60000 &&
        echo 'Kafka topics created.'
      "
    networks: [threat-net]
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks: [threat-net]
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

# ─────────────────────────────────────────────────────────────────────────────
# Application Layer
# ─────────────────────────────────────────────────────────────────────────────

  # ONNX model export (runs once before inference starts)
  model-export:
    build:
      context: .
      target: python-base
    container_name: model-export
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["python", "-m", "inference.export_onnx"]
    volumes:
      - onnx-models:/app/models/train/onnx
    environment:
      ONNX_MODELS_DIR: /app/models/train/onnx
    networks: [threat-net]
    restart: "no"

  # Rust ingestor: PCAP replay → raw-features Kafka topic
  ingestor:
    build:
      context: .
      target: ingestor
    container_name: ingestor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - rust-ingestor
      - --pcap
      - /app/data/syn_flood.pcap
      - /app/data/udp_amplification.pcap
      - /app/data/benign.pcap
      - /app/data/c2_beacon.pcap
      - /app/data/port_scan_horizontal.pcap
      - /app/data/dns_tunnel.pcap
      - --broker
      - kafka:9092
      - --target-pps
      - "0"   # Unlimited: maximum hardware speed
    networks: [threat-net]
    restart: unless-stopped

  # Python ONNX inference workers: raw-features → alerts-normalized
  inference:
    build:
      context: .
      target: python-base
    command: ["python", "-m", "inference.worker"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      model-export:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      ONNX_MODELS_DIR: /app/models/train/onnx
      INFERENCE_BATCH_SIZE: "256"
      INFERENCE_WORKERS: "4"
    volumes:
      - onnx-models:/app/models/train/onnx:ro
    networks: [threat-net]
    deploy:
      replicas: 2           # Scale horizontally for more throughput
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    restart: unless-stopped

  # FastAPI dashboard: REST API + SSE live stream
  dashboard:
    build:
      context: .
      target: dashboard
    container_name: dashboard
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      KAFKA_BROKER: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      PIPELINE_MODE: kafka   # Tells server.py to use Kafka SSE instead of telemetry.json
    networks: [threat-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/stats/summary"]
      interval: 15s
      timeout: 5s
      retries: 5
